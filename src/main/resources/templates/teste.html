<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elohostel - Assinatura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .subtitulo {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .planos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .plano {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            position: relative;
        }
        .plano:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .plano.selecionado {
            border-color: #ff914d;
            background: linear-gradient(to bottom, white, #fff5ec);
        }
        .plano h3 {
            font-size: 1.6rem;
            margin: 1rem 0 0.5rem;
            color: #333;
        }
        .preco {
            font-size: 2rem;
            font-weight: bold;
            color: #ff914d;
            margin: 1rem 0;
        }
        .preco small {
            font-size: 0.9rem;
            font-weight: normal;
        }
        .periodo {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
        .detalhes {
            text-align: left;
            margin: 1rem 0;
            padding: 0 1rem;
        }
        .detalhe {
            font-size: 0.85rem;
            padding: 0.3rem 0;
            color: #555;
        }
        .detalhe:before {
            content: "✓ ";
            color: #ff914d;
            font-weight: bold;
        }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff914d;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .form-card {
            background: white;
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .grupo {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #ff914d;
        }
        button {
            background: linear-gradient(135deg, #ff914d, #ff6b35);
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 0.5rem;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .erro {
            background: #fee;
            color: #c33;
            padding: 0.8rem;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
            text-align: center;
            border-left: 4px solid #c33;
        }
        .carregando {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: girar 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes girar {
            to { transform: rotate(360deg); }
        }
        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: white;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            color: white;
            font-size: 0.85rem;
        }
        @media (max-width: 768px) {
            .planos {
                flex-direction: column;
                align-items: center;
            }
            .plano {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏨 Elohostel</h1>
        <div class="subtitulo">Sistema completo para gestão de hostels</div>
    </div>

    <div id="planosContainer" class="planos">
        <div class="loading-spinner">📡 Carregando planos disponíveis...</div>
    </div>

    <div class="form-card">
        <div class="grupo">
            <label>Seu nome completo *</label>
            <input type="text" id="nome" placeholder="Ex: Ana Souza" autocomplete="name">
        </div>
        <div class="grupo">
            <label>E-mail para pagamento *</label>
            <input type="email" id="email" placeholder="contato@meuhostel.com" autocomplete="email">
        </div>
        <div class="grupo">
            <label>Observação (opcional)</label>
            <input type="text" id="observacao" placeholder="Alguma observação sobre a assinatura?">
        </div>
        <button id="btnAssinar">Assinar plano selecionado</button>
        <div id="mensagemErro" class="erro"></div>
    </div>

    <footer>
        🔒 Pagamento seguro via Mercado Pago · Dados criptografados · Suporte 24/7
    </footer>
</div>

<script>
    // ========= CONFIGURAÇÃO =========
    const API_BASE = window.location.origin;
    const API_PLANS = `${API_BASE}/api/plans`;
    const API_SUBSCRIPTION = `${API_BASE}/mp/subscription/create`;

    // ========= VARIÁVEIS GLOBAIS =========
    let planos = [];
    let planoSelecionado = null;
    let cardSelecionado = null;

    // ========= FUNÇÕES =========
    
    // Carregar planos do backend
    async function carregarPlanos() {
        const container = document.getElementById('planosContainer');
        container.innerHTML = '<div class="loading-spinner">📡 Carregando planos disponíveis...</div>';
        
        try {
            const response = await fetch(API_PLANS);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            planos = await response.json();
            
            if (!planos || planos.length === 0) {
                container.innerHTML = '<div class="loading-spinner">⚠️ Nenhum plano ativo encontrado. Contate o administrador.</div>';
                return;
            }
            
            renderizarPlanos(planos);
            
        } catch (error) {
            console.error('Erro ao carregar planos:', error);
            container.innerHTML = `<div class="loading-spinner">❌ Erro ao carregar planos: ${error.message}<br><br>
                                    <small>Verifique se o backend está rodando em ${API_BASE}</small></div>`;
        }
    }

    // Renderizar planos na tela
    function renderizarPlanos(planosList) {
        const container = document.getElementById('planosContainer');
        
        container.innerHTML = planosList.map(plano => `
            <div class="plano" data-plan-id="${plano.id}" data-plan-name="${plano.name}">
                <div class="badge">${plano.frequency} ${plano.frequencyType === 'months' ? 'mês(es)' : 'dia(s)'}</div>
                <h3>${formatarNomePlano(plano.name)}</h3>
                <div class="preco">R$ ${plano.transactionAmount.toFixed(2)}</div>
                <div class="periodo">por ${plano.frequency} ${plano.frequencyType === 'months' ? 'mês(es)' : 'dia(s)'}</div>
                <div class="detalhes">
                    ${plano.description ? `<div class="detalhe">${plano.description}</div>` : ''}
                    ${plano.maxRooms ? `<div class="detalhe">Até ${plano.maxRooms} quartos</div>` : ''}
                    ${plano.maxBeds ? `<div class="detalhe">Até ${plano.maxBeds} camas</div>` : ''}
                    <div class="detalhe">Suporte especializado</div>
                    <div class="detalhe">Integração com Airbnb</div>
                    <div class="detalhe">Relatórios avançados</div>
                </div>
            </div>
        `).join('');
        
        // Adicionar eventos de clique
        document.querySelectorAll('.plano').forEach(card => {
            card.addEventListener('click', () => {
                if (cardSelecionado) {
                    cardSelecionado.classList.remove('selecionado');
                }
                card.classList.add('selecionado');
                cardSelecionado = card;
                planoSelecionado = {
                    id: parseInt(card.getAttribute('data-plan-id')),
                    name: card.getAttribute('data-plan-name')
                };
                esconderErro();
            });
        });
    }

    // Formatar nome do plano para exibição
    function formatarNomePlano(nome) {
        const nomes = {
            'BASIC_MONTHLY': '📌 Básico',
            'PRO_MONTHLY': '🚀 Profissional',
            'BASIC_QUARTERLY': '📌 Trimestral',
            'PRO_ANNUAL': '⭐ Anual',
            'BASICO_11': '📌 Básico',
            'MEDIO_21': '🚀 Médio',
            'AVANCADO_50': '⭐ Avançado'
        };
        return nomes[nome] || nome.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
    }

    // Mostrar mensagem de erro
    function mostrarErro(msg) {
        const erroDiv = document.getElementById('mensagemErro');
        erroDiv.textContent = msg;
        erroDiv.style.display = 'block';
        setTimeout(() => {
            erroDiv.style.display = 'none';
        }, 5000);
    }

    function esconderErro() {
        document.getElementById('mensagemErro').style.display = 'none';
    }

    // Controle de estado do botão
    function setCarregando(ativo) {
        const btn = document.getElementById('btnAssinar');
        if (ativo) {
            btn.disabled = true;
            btn.innerHTML = '<span class="carregando"></span> Criando assinatura...';
        } else {
            btn.disabled = false;
            btn.innerHTML = 'Assinar plano selecionado';
        }
    }

    // Validar formulário
    function validarFormulario() {
        if (!planoSelecionado) {
            mostrarErro('❌ Selecione um plano primeiro.');
            return false;
        }
        
        const nome = document.getElementById('nome').value.trim();
        if (nome.length < 3) {
            mostrarErro('❌ Informe seu nome completo (mínimo 3 letras).');
            return false;
        }
        
        const email = document.getElementById('email').value.trim();
        const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailRegex.test(email)) {
            mostrarErro('❌ Digite um e-mail válido (ex: nome@dominio.com).');
            return false;
        }
        
        esconderErro();
        return true;
    }

    // Criar assinatura
    async function criarAssinatura() {
        if (!validarFormulario()) return;

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const observacao = document.getElementById('observacao').value.trim();
        
        const payload = {
            planId: planoSelecionado.id,
            payerName: nome,
            payerEmail: email,
            reason: observacao || `Assinatura ${planoSelecionado.name} - ${nome}`
        };

        console.log('Enviando payload:', payload);
        setCarregando(true);

        try {
            const response = await fetch(API_SUBSCRIPTION, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                let errorMsg = `Erro ${response.status}`;
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.error || errorData.message || errorMsg;
                    console.error('Detalhes do erro:', errorData);
                } catch(e) {
                    console.error('Erro ao parsear resposta de erro:', e);
                }
                throw new Error(errorMsg);
            }

            const data = await response.json();
            console.log('Resposta do servidor:', data);
            
            if (data.initPoint) {
                // Redirecionar para o checkout do Mercado Pago
                window.location.href = data.initPoint;
            } else {
                throw new Error('Link de pagamento não recebido do servidor.');
            }
            
        } catch (err) {
            console.error('Erro na criação da assinatura:', err);
            mostrarErro(`⚠️ Falha ao criar assinatura: ${err.message}`);
            setCarregando(false);
        }
    }

    // ========= INICIALIZAÇÃO =========
    document.getElementById('btnAssinar').addEventListener('click', criarAssinatura);
    
    // Enter key support
    document.getElementById('email').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            criarAssinatura();
        }
    });
    
    // Carregar planos ao iniciar
    carregarPlanos();
    
    // Recarregar planos a cada 30 segundos (opcional)
    setInterval(() => {
        carregarPlanos();
    }, 30000);
</script>
</body>
</html>
